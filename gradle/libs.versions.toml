[versions]
testcontainers = "1.21.4"

[libraries]
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version = "5.10.3" }
assertj-core = { module = "org.assertj:assertj-core", version = "3.27.4" }
logback-classic = { module = "ch.qos.logback:logback-classic", version = "1.5.12" }

testcontainers-jdbc = { module = "org.testcontainers:jdbc", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:mysql", version.ref = "testcontainers" }
postgresql = { module = "org.postgresql:postgresql", version = "42.7.8" }
mysql = { module = "com.mysql:mysql-connector-j", version = "9.4.0" }

# Each hibernate-orm-testing-NN module compiles against the first release of its line (compileOnly, so the consumer's own
# hibernate-core decides the runtime version) and runs its tests against the newest patch of the newest minor it covers.
hibernate-orm-v61-compile = { group = "org.hibernate.orm", name = "hibernate-core", version = "6.1.0.Final" }
hibernate-orm-v61-test = { group = "org.hibernate.orm", name = "hibernate-core", version = "6.1.7.Final" }
hibernate-orm-v62-compile = { group = "org.hibernate.orm", name = "hibernate-core", version = "6.2.0.Final" }
hibernate-orm-v62-test = { group = "org.hibernate.orm", name = "hibernate-core", version = "6.2.52.Final" }
hibernate-orm-v63-compile = { group = "org.hibernate.orm", name = "hibernate-core", version = "6.3.0.Final" }
hibernate-orm-v63-test = { group = "org.hibernate.orm", name = "hibernate-core", version = "6.6.59.Final" }
hibernate-orm-v70-compile = { group = "org.hibernate.orm", name = "hibernate-core", version = "7.0.0.Final" }
hibernate-orm-v70-test = { group = "org.hibernate.orm", name = "hibernate-core", version = "7.1.36.Final" }
hibernate-orm-v72-compile = { group = "org.hibernate.orm", name = "hibernate-core", version = "7.2.0.Final" }
hibernate-orm-v72-test = { group = "org.hibernate.orm", name = "hibernate-core", version = "7.4.15.Final" }
hibernate-orm-v80-compile = { group = "org.hibernate.orm", name = "hibernate-core", version = "8.0.0.CR1" }
hibernate-orm-v80-test = { group = "org.hibernate.orm", name = "hibernate-core", version = "8.0.0.CR1" }
