version=0.1.1-SNAPSHOT

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.console=verbose
org.gradle.warning.mode=all

org.gradle.jvmargs="-XX:MaxMetaspaceSize=512m"

org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false

systemProp.file.encoding=UTF-8

# Maven Central answers bursts from shared CI egress with 429; wait them out: 6 attempts, backoff doubling from 2s (about 1 minute in total).
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000
